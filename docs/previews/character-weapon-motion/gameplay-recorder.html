<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actual character + weapon gameplay capture</title><link rel="icon" href="data:,"></head><body><div id="root"></div><canvas id="capture-output" width="1280" height="720" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:9999;pointer-events:none"></canvas><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';
import App from '../../../src/App.jsx';import {GameSession} from '../../../src/game-session.js';
const weapon=new URLSearchParams(location.search).get('weapon')||'sword';
const fixtures=await fetch(`actual-${weapon}.json`).then(r=>r.json());
const session=new GameSession();session.sound.enabled=false;createRoot(document.querySelector('#root')).render(React.createElement(App,{session}));
const canvas=document.querySelector('#capture-output'),ctx=canvas.getContext('2d');
let chapter,chapterIndex=0,localTime=0,allEvents=[],recording=false,drawStart=0,sourceCanvas,sourceStream;
const sourceVideo=document.createElement('video');sourceVideo.muted=true;sourceVideo.playsInline=true;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms)),frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
const impact=session.impact.bind(session);session.impact=event=>{if(recording)allEvents.push({chapter:chapter.id,time:session.world.time,...event});impact(event);};
function desiredKeys(input){const codes=[];if(input.theta)codes.push(input.theta>0?'KeyW':'KeyS');if(input.phi)codes.push(input.phi>0?'KeyD':'KeyA');if(input.skill)codes.push('KeyF');for(const code of [...session.keys])if(!codes.includes(code))session.keyUp(code);for(const code of codes)if(!session.keys.has(code))session.keyDown(code);return codes.map(k=>k.replace('Key','')).join(' + ')||'RELEASE';}
function draw(now){
 requestAnimationFrame(draw);if(!session.renderer||!chapter)return;
 if(recording){localTime=Math.max(0,(now-drawStart)/1000);const sample=chapter.inputs[Math.min(chapter.inputs.length-1,Math.floor(localTime*60))];desiredKeys(sample.input);}
 ctx.fillStyle='#f5f2e9';ctx.fillRect(0,0,1280,720);if(sourceVideo.readyState>=2)ctx.drawImage(sourceVideo,0,104,1280,520);
 ctx.fillStyle='#829075';ctx.font='14px system-ui';ctx.fillText(`WANKAI / BEAGLE + ${weapon.toUpperCase()} / ACTUAL GAME RUNTIME`,30,28);ctx.fillText(`Chapter ${chapterIndex+1}/${fixtures.chapters.length} · independent reset · 1×`,830,28);
 ctx.fillStyle='#30372e';ctx.font='bold 25px system-ui';ctx.fillText(chapter.title,30,67);
 const p=session.world.players[0],events=allEvents.filter(e=>e.chapter===chapter.id),keys=[...session.keys].map(k=>k.replace('Key','')).join(' + ')||'RELEASE';
 ctx.fillStyle='#bd6048';ctx.font='bold 20px system-ui';ctx.fillText(chapter.id==='no-hover'?'F (ignored)':keys,30,658);ctx.fillStyle='#667455';ctx.font='15px system-ui';ctx.fillText(`HP ${p.health}   Stamina ${Math.ceil(p.stamina)} / 200   Skill ${p.skillActive?'ON':'OFF'}`,260,658);ctx.fillText(`Hits ${events.filter(e=>e.type==='hit'&&e.attacker===0).length}   Clashes ${events.filter(e=>e.type==='clash').length}`,930,658);
 ctx.font='13px system-ui';ctx.fillText('Actual App + GameSession + ArenaPhysics + ArenaView · scripted control/contact fixtures · no authored travel or launch',30,695);
}
requestAnimationFrame(draw);
while(!session.renderer)await delay(30);await delay(500);window.actualCaptureReady=true;
window.recordActualGameplay=async()=>{
 const chunks=[],stream=canvas.captureStream(30),recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:5000000});
 recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 const stopped=new Promise(resolve=>recorder.onstop=resolve);recorder.start();recorder.pause();allEvents=[];
 const results=[];
 for(let i=0;i<fixtures.chapters.length;i++){
  chapter=fixtures.chapters[i];chapterIndex=i;recording=false;localTime=0;
  session.goHome();session.setLoadouts([{characterId:'beagle',weaponId:weapon},{characterId:'basic-fighter',weaponId:'polearm'}]);session.startRound(chapter.mode);
  // Warm the actual application renderer during countdown; physics has not begun.
  await delay(i===0||fixtures.chapters[i-1].mode!==chapter.mode?1800:180);
  if(sourceCanvas!==session.renderer.domElement){sourceStream?.getTracks().forEach(t=>t.stop());sourceCanvas=session.renderer.domElement;sourceStream=sourceCanvas.captureStream(30);sourceVideo.srcObject=sourceStream;await sourceVideo.play();await frame();}
  for(const [id,p]of session.world.players.entries())Object.assign(p,{p:{...chapter.initial[id].p},theta:chapter.initial[id].theta,phi:chapter.initial[id].phi});
  session.state='playing';session.countdown=0;session.accumulator=0;session.freeze=0;session.world.time=0;session.visualRevision++;session.publish();
  drawStart=performance.now();recording=true;desiredKeys(chapter.inputs[0].input);await frame();recorder.resume();
  await delay(chapter.duration*1000);recorder.pause();recording=false;session.clearKeys();
  const events=allEvents.filter(e=>e.chapter===chapter.id),p=session.world.players[0];results.push({id:chapter.id,hits:events.filter(e=>e.type==='hit'&&e.attacker===0).length,clashes:events.filter(e=>e.type==='clash').length,skillActive:p.skillActive,simulationTime:session.world.time});
 }
 recorder.stop();await stopped;stream.getTracks().forEach(t=>t.stop());sourceStream?.getTracks().forEach(t=>t.stop());sourceCanvas=null;session.goHome();
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download=`after-${weapon}.webm`;a.click();
 const report={weapon,type:fixtures.type,hashes:fixtures.hashes,results,passed:results.filter(c=>c.id.endsWith('hit')).every(c=>c.hits>0)&&results.find(c=>c.id==='block-clash').clashes>0&&results.every(c=>!c.skillActive)};
 window.actualCaptureReport=report;return report;
};
</script></body></html>
