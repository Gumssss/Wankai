<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>图标渲染</title>
  <style>body { margin: 0; background: #888; } canvas { display: block; width: 512px; height: 512px; }</style>
</head>
<body>
  <script type="module">
    // Renders the app icon's subject on a transparent background: 奶蛙 (the
    // real imported model) with its staff 奶木昆 held across its body.
    // tools/make-icon.mjs opens it and saves window.__sheetPng; tools/make-icon.py
    // composites the result onto the rounded tile.
    // ?yaw=26&pitch=8&size=1024&mode=full|bust (and the staff placement: tilt, gx, gy, gd, staffScale)
    import * as THREE from 'three';
    import { buildCharacter } from '/src/models/characters.js';
    import { preloadCharacterModels } from '/src/models/character-assets.js';
    import { buildWeapon } from '/src/models/weapons.js';
    import { makePlayer, v3 } from '/src/physics.js';

    const query = new URLSearchParams(location.search);
    const number = (key, fallback) => query.has(key) ? Number(query.get(key)) : fallback;
    const SIZE = number('size', 1024), FOV = number('fov', 24);
    const yaw = THREE.MathUtils.degToRad(number('yaw', 26)), pitch = THREE.MathUtils.degToRad(number('pitch', 8));

    await preloadCharacterModels();
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = number('exposure', 1.2);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(1);
    renderer.setSize(SIZE, SIZE);
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.add(new THREE.HemisphereLight(0xfff6e4, 0xb8a98a, 2.5));
    const key = new THREE.DirectionalLight(0xfff0d6, 2.8); key.position.set(5, 6, 4); scene.add(key);
    const rim = new THREE.DirectionalLight(0xdff0ff, 1.1); rim.position.set(-4, 3, -3); scene.add(rim);

    const loadout = { characterId: 'naiwa', weaponId: 'yellow-staff' };
    const player = makePlayer(0, loadout);
    player.p = v3(0, 0, 0);
    player.phi = player.bodyYaw = 0;
    player.theta = 0.55;
    const fighter = buildCharacter(loadout, 0);
    fighter.pose(player, 0.3);
    scene.add(fighter.root);

    // The staff crosses diagonally behind the frog, like a hero's pole. Its
    // grip is placed in picture space: gx to the right, gy up, gd towards the camera.
    const direction = new THREE.Vector3(Math.cos(pitch) * Math.cos(yaw), Math.sin(pitch), Math.cos(pitch) * Math.sin(yaw));
    const across = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
    const staff = buildWeapon('yellow-staff', 0).root;
    staff.scale.setScalar(number('staffScale', 1.15));
    staff.position.copy(across).multiplyScalar(number('gx', -1.0))
      .add(new THREE.Vector3(0, number('gy', 0.05), 0))
      .addScaledVector(new THREE.Vector3(Math.cos(yaw), 0, Math.sin(yaw)), number('gd', -0.45));
    // Lean it in the picture plane (negative: the top leans right).
    staff.rotateOnWorldAxis(direction.clone().normalize(), THREE.MathUtils.degToRad(number('tilt', -50)));
    scene.add(staff);

    scene.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(scene);
    // Frame the whole group with a small margin.
    const camera = new THREE.PerspectiveCamera(FOV, 1, 0.05, 80);
    const center = box.getCenter(new THREE.Vector3());
    const right = new THREE.Vector3().crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize().negate();
    const up = new THREE.Vector3().crossVectors(right, direction).normalize().negate();
    const tan = Math.tan(THREE.MathUtils.degToRad(FOV / 2)), margin = number('margin', 1.04);
    let distance = 0;
    for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
      const p = new THREE.Vector3(x, y, z).sub(center), depth = p.dot(direction);
      distance = Math.max(distance, depth + Math.abs(p.dot(right)) * margin / tan, depth + Math.abs(p.dot(up)) * margin / tan);
    }
    // mode=bust: a close-up of the head and the staff behind it, for the 16-48 px icons.
    if (query.get('mode') === 'bust') {
      const body = new THREE.Box3().setFromObject(fighter.root);
      center.set((body.min.x + body.max.x) / 2, body.min.y + (body.max.y - body.min.y) * number('ty', 0.72), (body.min.z + body.max.z) / 2);
      distance = number('span', 1.3) / 2 / tan;
    }
    camera.position.copy(center).addScaledVector(direction, distance);
    camera.lookAt(center);
    renderer.render(scene, camera);
    window.__sheetPng = renderer.domElement.toDataURL('image/png');
    window.__sheetReady = true;
  </script>
</body>
</html>
